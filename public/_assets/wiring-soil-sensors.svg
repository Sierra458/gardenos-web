<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" role="img" aria-labelledby="title desc" font-family="-apple-system, Inter, sans-serif">
  <title id="title">Soil moisture sensor wiring to Arduino Mega 2560</title>
  <desc id="desc">Two Gikfun capacitive soil moisture sensors wired to the Arduino Mega: red wires from 5V to both VCC pins, black wires from GND to both GND pins, yellow wires from A0 and A1 to each sensor's AOUT pin.</desc>

  <!-- Background -->
  <rect width="820" height="540" fill="transparent"/>

  <!-- ARDUINO MEGA 2560 -->
  <g transform="translate(40,180)">
    <!-- Board -->
    <rect x="0" y="0" width="320" height="180" rx="6" fill="#0d6cb6" stroke="#0a4f86" stroke-width="2"/>
    <!-- Label -->
    <text x="160" y="22" fill="#fafafa" font-size="13" font-weight="700" letter-spacing="1.2" text-anchor="middle">ARDUINO MEGA 2560</text>
    <text x="160" y="38" fill="#bcd9f0" font-size="9" letter-spacing="2" text-anchor="middle">ATmega2560</text>

    <!-- USB port (left side) -->
    <rect x="-22" y="60" width="28" height="40" rx="2" fill="#9ca3af" stroke="#52525b" stroke-width="1"/>
    <text x="-8" y="115" fill="#9ca3af" font-size="9" text-anchor="middle">USB-B</text>

    <!-- Top digital pin header (decorative) -->
    <rect x="14" y="50" width="290" height="10" fill="#0a4f86"/>
    <g fill="#1f2937">
      <rect x="20" y="51" width="3" height="8"/>
      <rect x="40" y="51" width="3" height="8"/>
      <rect x="60" y="51" width="3" height="8"/>
      <rect x="80" y="51" width="3" height="8"/>
      <rect x="100" y="51" width="3" height="8"/>
      <rect x="120" y="51" width="3" height="8"/>
      <rect x="140" y="51" width="3" height="8"/>
      <rect x="160" y="51" width="3" height="8"/>
      <rect x="180" y="51" width="3" height="8"/>
      <rect x="200" y="51" width="3" height="8"/>
      <rect x="220" y="51" width="3" height="8"/>
      <rect x="240" y="51" width="3" height="8"/>
      <rect x="260" y="51" width="3" height="8"/>
      <rect x="280" y="51" width="3" height="8"/>
    </g>

    <!-- ATmega chip (decorative) -->
    <rect x="115" y="80" width="90" height="60" fill="#1c1917" stroke="#52525b" stroke-width="1" rx="2"/>
    <text x="160" y="115" fill="#a1a1aa" font-size="9" text-anchor="middle">ATmega2560</text>

    <!-- Power & analog pin row (bottom) -->
    <rect x="14" y="155" width="290" height="14" fill="#0a4f86"/>
    <text x="40" y="165" fill="#fafafa" font-size="9" font-weight="700" text-anchor="middle">5V</text>
    <text x="80" y="165" fill="#fafafa" font-size="9" font-weight="700" text-anchor="middle">GND</text>
    <text x="200" y="165" fill="#fafafa" font-size="9" font-weight="700" text-anchor="middle">A0</text>
    <text x="240" y="165" fill="#fafafa" font-size="9" font-weight="700" text-anchor="middle">A1</text>

    <!-- Pin terminal dots (where wires anchor) -->
    <circle cx="40" cy="178" r="4" fill="#facc15" stroke="#1f2937" stroke-width="1"/>
    <circle cx="80" cy="178" r="4" fill="#facc15" stroke="#1f2937" stroke-width="1"/>
    <circle cx="200" cy="178" r="4" fill="#facc15" stroke="#1f2937" stroke-width="1"/>
    <circle cx="240" cy="178" r="4" fill="#facc15" stroke="#1f2937" stroke-width="1"/>
  </g>

  <!-- SENSOR 1 — Lavender -->
  <g transform="translate(540,40)">
    <rect x="0" y="0" width="240" height="120" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <text x="120" y="20" fill="#fafafa" font-size="13" font-weight="700" text-anchor="middle">SENSOR 1</text>
    <text x="120" y="34" fill="#a1a1aa" font-size="10" text-anchor="middle">Lavender pot · A0</text>
    <text x="120" y="58" fill="#a1a1aa" font-size="9" text-anchor="middle">Capacitive Soil Moisture v1.2</text>

    <!-- Probe end (decorative) -->
    <rect x="100" y="70" width="40" height="40" fill="#16a34a" opacity="0.25"/>
    <text x="120" y="95" fill="#22c55e" font-size="8" text-anchor="middle">probe</text>

    <!-- Pin terminals (left edge) -->
    <circle cx="0" cy="30" r="5" fill="#ef4444" stroke="#1f2937" stroke-width="1"/>
    <text x="-10" y="33" fill="#ef4444" font-size="9" font-weight="700" text-anchor="end">VCC</text>

    <circle cx="0" cy="60" r="5" fill="#71717a" stroke="#1f2937" stroke-width="1"/>
    <text x="-10" y="63" fill="#a1a1aa" font-size="9" font-weight="700" text-anchor="end">GND</text>

    <circle cx="0" cy="90" r="5" fill="#facc15" stroke="#1f2937" stroke-width="1"/>
    <text x="-10" y="93" fill="#facc15" font-size="9" font-weight="700" text-anchor="end">AOUT</text>
  </g>

  <!-- SENSOR 2 — Potato Tower -->
  <g transform="translate(540,380)">
    <rect x="0" y="0" width="240" height="120" rx="4" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <text x="120" y="20" fill="#fafafa" font-size="13" font-weight="700" text-anchor="middle">SENSOR 2</text>
    <text x="120" y="34" fill="#a1a1aa" font-size="10" text-anchor="middle">Potato tower · A1</text>
    <text x="120" y="58" fill="#a1a1aa" font-size="9" text-anchor="middle">Capacitive Soil Moisture v1.2</text>

    <rect x="100" y="70" width="40" height="40" fill="#a16207" opacity="0.3"/>
    <text x="120" y="95" fill="#eab308" font-size="8" text-anchor="middle">probe</text>

    <circle cx="0" cy="30" r="5" fill="#ef4444" stroke="#1f2937" stroke-width="1"/>
    <text x="-10" y="33" fill="#ef4444" font-size="9" font-weight="700" text-anchor="end">VCC</text>

    <circle cx="0" cy="60" r="5" fill="#71717a" stroke="#1f2937" stroke-width="1"/>
    <text x="-10" y="63" fill="#a1a1aa" font-size="9" font-weight="700" text-anchor="end">GND</text>

    <circle cx="0" cy="90" r="5" fill="#facc15" stroke="#1f2937" stroke-width="1"/>
    <text x="-10" y="93" fill="#facc15" font-size="9" font-weight="700" text-anchor="end">AOUT</text>
  </g>

  <!-- WIRES -->
  <g fill="none" stroke-width="3" stroke-linecap="round" opacity="0.95">
    <!-- 5V (red) → Sensor 1 VCC. Mega 5V is at (40+40, 180+178) = (80, 358) — wait, transform was 40,180.
         Mega 5V terminal: world coord (40+40, 180+178) = (80, 358).
         Sensor 1 VCC: world (540+0, 40+30) = (540, 70). -->
    <path d="M 80,358 C 80,260 540,180 540,70" stroke="#ef4444"/>

    <!-- 5V → Sensor 2 VCC. Sensor 2 VCC: (540, 380+30) = (540, 410). -->
    <path d="M 80,358 C 80,400 360,420 540,410" stroke="#ef4444"/>

    <!-- GND → Sensor 1 GND. Mega GND: (40+80, 180+178) = (120, 358).
         Sensor 1 GND: (540, 40+60) = (540, 100). -->
    <path d="M 120,358 C 120,250 530,210 540,100" stroke="#71717a"/>

    <!-- GND → Sensor 2 GND. Sensor 2 GND: (540, 380+60) = (540, 440). -->
    <path d="M 120,358 C 120,420 380,450 540,440" stroke="#71717a"/>

    <!-- A0 (yellow) → Sensor 1 AOUT. Mega A0: (40+200, 180+178) = (240, 358).
         Sensor 1 AOUT: (540, 40+90) = (540, 130). -->
    <path d="M 240,358 C 240,260 540,220 540,130" stroke="#facc15"/>

    <!-- A1 (yellow) → Sensor 2 AOUT. Mega A1: (40+240, 180+178) = (280, 358).
         Sensor 2 AOUT: (540, 380+90) = (540, 470). -->
    <path d="M 280,358 C 280,420 410,490 540,470" stroke="#facc15"/>
  </g>

  <!-- LEGEND -->
  <g transform="translate(40,440)">
    <rect x="-4" y="-8" width="380" height="80" fill="#0f0f0f" stroke="#1f1f1f" stroke-width="1" rx="6"/>
    <text x="0" y="8" fill="#a1a1aa" font-size="10" font-weight="700" letter-spacing="1.2">WIRES</text>

    <line x1="0" y1="26" x2="30" y2="26" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <text x="40" y="29" fill="#fafafa" font-size="11">Red — 5V power to sensor VCC</text>

    <line x1="0" y1="44" x2="30" y2="44" stroke="#71717a" stroke-width="3" stroke-linecap="round"/>
    <text x="40" y="47" fill="#fafafa" font-size="11">Black — GND to sensor GND</text>

    <line x1="0" y1="62" x2="30" y2="62" stroke="#facc15" stroke-width="3" stroke-linecap="round"/>
    <text x="40" y="65" fill="#fafafa" font-size="11">Yellow — A0 / A1 to sensor AOUT (analog signal)</text>
  </g>
</svg>
